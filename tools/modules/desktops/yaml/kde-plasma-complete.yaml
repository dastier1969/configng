  mid:
    # Drop the GTK-stack equivalents that KDE already provides via
    # ark/gwenview/okular at the minimal tier.
    packages_remove:
      - gnome-text-editor
      - file-roller
      - loupe
    packages:
      - kate

  full:
    # KDE Plasma drops the libreoffice-gtk3 integration package
    # because we want native KDE file pickers / theming. There used
    # to be a 'libreoffice-kde' package but it was retired upstream
    # and no longer exists in any Debian / Ubuntu release we support
    # (verified against bookworm/trixie/noble/plucky as of 2026).
    # Plain 'libreoffice' (inherited from common.yaml full) is fine
    # — modern LibreOffice picks up KDE integration automatically
    # via libreoffice-style-breeze when it's installed alongside
    # Plasma.
    packages_remove:
      - libreoffice-gtk3

releases:
  trixie:
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - accountsservice
      - libpipewire-0.3-0t64
      - libpipewire-0.3-common
      - libpipewire-0.3-modules
      - libpipewire-0.3-modules-x11
      - libu2f-udev
      - pipewire-alsa
      - pipewire-audio
      - pipewire-audio-client-libraries
      - pipewire-bin
      - pipewire-pulse
      - pipewire-v4l2
      - pipewire-system-services
      - wireplumber
      - wireplumber-system-services
    packages_remove:
      - lightdm
      - lightdm-gtk-greeter
      - pulseaudio
      - pulseaudio-module-bluetooth

  # ── Debian 14 / Debian Sid ─────────────────────────────────────────

  forky:
    # Debian 14 — pipewire replaces pulseaudio (same as trixie).
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - accountsservice
      - libpipewire-0.3-0t64
      - libpipewire-0.3-common
      - libpipewire-0.3-modules
      - libpipewire-0.3-modules-x11
      - libu2f-udev
      - pipewire-alsa
      - pipewire-audio
      - pipewire-audio-client-libraries
      - pipewire-bin
      - pipewire-pulse
      - pipewire-v4l2
      - pipewire-system-services
      - wireplumber
      - wireplumber-system-services
    packages_remove:
      - lightdm
      - lightdm-gtk-greeter
      - pulseaudio
      - pulseaudio-module-bluetooth

  sid:
    # Debian unstable — pipewire replaces pulseaudio (same as trixie/forky).
    # loong64 is a 64-bit arch capable of running KDE Plasma.
    architectures: [arm64, amd64, loong64, riscv64]
    packages:
      - accountsservice
      - libpipewire-0.3-0t64
      - libpipewire-0.3-common
      - libpipewire-0.3-modules
      - libpipewire-0.3-modules-x11
      - libu2f-udev
      - pipewire-alsa
      - pipewire-audio
      - pipewire-audio-client-libraries
      - pipewire-bin
      - pipewire-pulse
      - pipewire-v4l2
      - pipewire-system-services
      - wireplumber
      - wireplumber-system-services
    packages_remove:
      - lightdm
      - lightdm-gtk-greeter
      - pulseaudio
      - pulseaudio-module-bluetooth


