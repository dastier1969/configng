releases:
  # ── Debian 13 / Debian Trixie ─────────────────────────────────────────
  trixie:
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - accountsservice
      - libu2f-udev
    packages_remove:
      - pulseaudio
  # ── Debian 14 / Debian Sid ─────────────────────────────────────────
  forky:
    # Debian 14 — pipewire replaces pulseaudio (same as trixie).
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - accountsservice
      - libu2f-udev
    packages_remove:
      - pulseaudio
  sid:
    # Debian unstable — pipewire replaces pulseaudio (same as trixie/forky).
    # loong64 is a 64-bit arch capable of running KDE Plasma.
    architectures: [arm64, amd64, loong64, riscv64]
    packages:
      - accountsservice
      - libu2f-udev
    packages_remove:
      - pulseaudio
